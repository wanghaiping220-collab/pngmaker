<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Batch Generator - 批量图片生成器</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                    </svg>
                    <span>PNG Generator</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="single">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <line x1="9" y1="9" x2="15" y2="9"/>
                        <line x1="9" y1="13" x2="15" y2="13"/>
                        <line x1="9" y1="17" x2="12" y2="17"/>
                    </svg>
                    <span>单图生成</span>
                </button>
                <button class="nav-item" data-tab="batch">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="2" width="8" height="8" rx="1"/>
                        <rect x="14" y="2" width="8" height="8" rx="1"/>
                        <rect x="2" y="14" width="8" height="8" rx="1"/>
                        <rect x="14" y="14" width="8" height="8" rx="1"/>
                    </svg>
                    <span>批量生成</span>
                </button>
                <button class="nav-item" data-tab="templates">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                        <path d="M14 2v6h6"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <span>模板管理</span>
                </button>
                <button class="nav-item" data-tab="history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                    <span>生成历史</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <!-- 主题切换 -->
                <div class="theme-switcher">
                    <button class="theme-btn" data-theme="light" title="浅色模式">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"/>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                        </svg>
                    </button>
                    <button class="theme-btn" data-theme="dark" title="深色模式">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                        </svg>
                    </button>
                    <button class="theme-btn" data-theme="system" title="跟随系统">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                    </button>
                </div>
                <button class="nav-item" id="settingsBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"/>
                        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
                    </svg>
                    <span>设置</span>
                </button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 单图生成面板 -->
            <div class="tab-content active" id="tab-single">
                <div class="panel-layout">
                    <!-- 配置面板 -->
                    <div class="config-panel">
                        <div class="panel-header">
                            <h2>图片配置</h2>
                            <div class="header-actions">
                                <button class="btn btn-ghost" id="loadPresetBtn" title="加载预设模板">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                                        <polyline points="2 17 12 22 22 17"/>
                                        <polyline points="2 12 12 17 22 12"/>
                                    </svg>
                                    预设
                                </button>
                                <button class="btn btn-ghost" id="loadTemplateBtn" title="加载模板">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                        <polyline points="17 8 12 3 7 8"/>
                                        <line x1="12" y1="3" x2="12" y2="15"/>
                                    </svg>
                                    导入
                                </button>
                                <button class="btn btn-ghost" id="saveTemplateBtn" title="保存模板">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                                        <polyline points="17 21 17 13 7 13 7 21"/>
                                        <polyline points="7 3 7 8 15 8"/>
                                    </svg>
                                    保存
                                </button>
                                <button class="btn btn-ghost" id="downloadTemplateBtn" title="下载模板">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                                        <polyline points="7 10 12 15 17 10"/>
                                        <line x1="12" y1="15" x2="12" y2="3"/>
                                    </svg>
                                    导出
                                </button>
                            </div>
                        </div>

                        <div class="config-sections">
                            <!-- 画布配置 -->
                            <section class="config-section">
                                <div class="section-header" data-collapse="canvas">
                                    <h3>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                                        </svg>
                                        画布设置
                                    </h3>
                                    <svg class="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                        <polyline points="6 9 12 15 18 9"/>
                                    </svg>
                                </div>
                                <div class="section-content" id="canvas-section">
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>宽度 (px)</label>
                                            <input type="number" id="canvasWidth" value="1080" min="100" max="4096">
                                        </div>
                                        <div class="form-group">
                                            <label>高度 (px)</label>
                                            <input type="number" id="canvasHeight" value="1920" min="100" max="4096">
                                        </div>
                                    </div>
                                    <div class="form-group full-width">
                                        <label>平台预设</label>
                                        <select id="platformPreset">
                                            <option value="custom">自定义尺寸</option>
                                            <optgroup label="竖屏视频 9:16">
                                                <option value="douyin" selected>抖音 (1080×1920)</option>
                                                <option value="shipinhao">视频号 (1080×1920)</option>
                                                <option value="kuaishou">快手 (1080×1920)</option>
                                                <option value="tiktok">TikTok (1080×1920)</option>
                                                <option value="instagram_reels">Instagram Reels (1080×1920)</option>
                                                <option value="youtube_shorts">YouTube Shorts (1080×1920)</option>
                                                <option value="bilibili">B站 (1080×1920)</option>
                                            </optgroup>
                                            <optgroup label="小红书">
                                                <option value="xiaohongshu">小红书 3:4 (1080×1440)</option>
                                            </optgroup>
                                            <optgroup label="正方形 1:1">
                                                <option value="wechat_moments">微信朋友圈 (1080×1080)</option>
                                                <option value="instagram_post">Instagram 帖子 (1080×1080)</option>
                                            </optgroup>
                                            <optgroup label="横屏 16:9">
                                                <option value="youtube">YouTube 封面 (1920×1080)</option>
                                                <option value="bilibili_cover">B站封面 (1920×1080)</option>
                                            </optgroup>
                                        </select>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>背景</label>
                                            <div class="bg-toggle">
                                                <button class="bg-option active" data-bg="transparent">透明</button>
                                                <button class="bg-option" data-bg="color">颜色</button>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label>背景色</label>
                                            <input type="color" id="bgColor" value="#ffffff" class="hidden">
                                        </div>
                                    </div>
                                    <div class="form-group full-width">
                                        <label>
                                            <input type="checkbox" id="showSafeZone"> 显示安全区参考线
                                        </label>
                                    </div>
                                    <div class="form-group full-width">
                                        <label>
                                            <input type="checkbox" id="autoFitSafeZone"> 文字自动适应安全区
                                        </label>
                                        <small class="form-hint">自动换行和缩放以适应安全区域</small>
                                    </div>
                                </div>
                            </section>

                            <!-- 一级标题 -->
                            <section class="config-section" id="section-primary">
                                <div class="section-header" data-collapse="primary">
                                    <h3>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                            <polyline points="4 7 4 4 20 4 20 7"/>
                                            <line x1="9" y1="20" x2="15" y2="20"/>
                                            <line x1="12" y1="4" x2="12" y2="20"/>
                                        </svg>
                                        一级标题
                                    </h3>
                                    <div class="section-toggle">
                                        <label class="switch">
                                            <input type="checkbox" id="primaryEnabled" checked>
                                            <span class="slider"></span>
                                        </label>
                                        <svg class="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                            <polyline points="6 9 12 15 18 9"/>
                                        </svg>
                                    </div>
                                </div>
                                <div class="section-content" id="primary-section">
                                    <div class="form-group full-width">
                                        <label>文字内容</label>
                                        <textarea id="primaryText" rows="2" placeholder="输入一级标题文字...">小鹏P7+挑战多米诺车位</textarea>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>字体</label>
                                            <select id="primaryFont" class="font-select">
                                                <option value="default">默认字体</option>
                                                <option value="msyh" selected>微软雅黑</option>
                                                <option value="simhei">黑体</option>
                                                <option value="simsun">宋体</option>
                                                <option value="kaiti">楷体</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>字号</label>
                                            <input type="number" id="primarySize" value="64" min="12" max="200">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>颜色</label>
                                            <div class="color-input">
                                                <input type="color" id="primaryColor" value="#ff6600">
                                                <input type="text" id="primaryColorText" value="#FF6600">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label>Y位置</label>
                                            <input type="number" id="primaryY" value="100" min="0">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>X位置</label>
                                            <input type="number" id="primaryX" value="" placeholder="自动居中">
                                        </div>
                                        <div class="form-group">
                                            <label>对齐</label>
                                            <div class="align-buttons">
                                                <button class="align-btn" data-align="left" data-target="primary" title="左对齐">L</button>
                                                <button class="align-btn active" data-align="center" data-target="primary" title="居中">C</button>
                                                <button class="align-btn" data-align="right" data-target="primary" title="右对齐">R</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>样式</label>
                                            <div class="style-buttons">
                                                <button class="style-btn active" data-style="bold" data-target="primary" title="粗体">B</button>
                                                <button class="style-btn" data-style="italic" data-target="primary" title="斜体">I</button>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- 高级特效 -->
                                    <details class="advanced-options">
                                        <summary>高级特效</summary>
                                        <div class="advanced-content">
                                            <div class="effect-group">
                                                <label class="effect-label">
                                                    <input type="checkbox" id="primaryStrokeEnabled">
                                                    <span>描边</span>
                                                </label>
                                                <div class="effect-options">
                                                    <div class="form-row">
                                                        <div class="form-group">
                                                            <label>颜色</label>
                                                            <input type="color" id="primaryStrokeColor" value="#000000">
                                                        </div>
                                                        <div class="form-group">
                                                            <label>宽度</label>
                                                            <input type="number" id="primaryStrokeWidth" value="2" min="1" max="10">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="effect-group">
                                                <label class="effect-label">
                                                    <input type="checkbox" id="primaryShadowEnabled">
                                                    <span>阴影</span>
                                                </label>
                                                <div class="effect-options">
                                                    <div class="form-row">
                                                        <div class="form-group">
                                                            <label>颜色</label>
                                                            <input type="color" id="primaryShadowColor" value="#333333">
                                                        </div>
                                                        <div class="form-group">
                                                            <label>模糊</label>
                                                            <input type="number" id="primaryShadowBlur" value="2" min="0" max="20">
                                                        </div>
                                                    </div>
                                                    <div class="form-row">
                                                        <div class="form-group">
                                                            <label>X偏移</label>
                                                            <input type="number" id="primaryShadowX" value="3" min="-20" max="20">
                                                        </div>
                                                        <div class="form-group">
                                                            <label>Y偏移</label>
                                                            <input type="number" id="primaryShadowY" value="3" min="-20" max="20">
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="effect-group">
                                                <label class="effect-label">
                                                    <input type="checkbox" id="primaryBgBlockEnabled">
                                                    <span>背景色块</span>
                                                </label>
                                                <div class="effect-options">
                                                    <div class="form-row">
                                                        <div class="form-group">
                                                            <label>颜色</label>
                                                            <input type="color" id="primaryBgBlockColor" value="#ffff00">
                                                        </div>
                                                        <div class="form-group">
                                                            <label>透明度</label>
                                                            <input type="range" id="primaryBgBlockOpacity" value="200" min="0" max="255">
                                                        </div>
                                                    </div>
                                                    <div class="form-row">
                                                        <div class="form-group">
                                                            <label>内边距X</label>
                                                            <input type="number" id="primaryBgBlockPaddingX" value="20" min="0" max="100">
                                                        </div>
                                                        <div class="form-group">
                                                            <label>内边距Y</label>
                                                            <input type="number" id="primaryBgBlockPaddingY" value="10" min="0" max="100">
                                                        </div>
                                                    </div>
                                                    <div class="form-group full-width">
                                                        <label>圆角</label>
                                                        <input type="number" id="primaryBgBlockRadius" value="8" min="0" max="50">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </details>
                                </div>
                            </section>

                            <!-- 二级标题 -->
                            <section class="config-section" id="section-secondary">
                                <div class="section-header" data-collapse="secondary">
                                    <h3>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                            <polyline points="4 7 4 4 20 4 20 7"/>
                                            <line x1="9" y1="20" x2="15" y2="20"/>
                                            <line x1="12" y1="4" x2="12" y2="20"/>
                                        </svg>
                                        二级标题
                                    </h3>
                                    <div class="section-toggle">
                                        <label class="switch">
                                            <input type="checkbox" id="secondaryEnabled" checked>
                                            <span class="slider"></span>
                                        </label>
                                        <svg class="collapse-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                            <polyline points="6 9 12 15 18 9"/>
                                        </svg>
                                    </div>
                                </div>
                                <div class="section-content" id="secondary-section">
                                    <div class="form-group full-width">
                                        <label>文字内容</label>
                                        <textarea id="secondaryText" rows="2" placeholder="输入二级标题文字...">从一穷二白到反客为主
只用了几十年</textarea>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>字体</label>
                                            <select id="secondaryFont" class="font-select">
                                                <option value="default">默认字体</option>
                                                <option value="msyh" selected>微软雅黑</option>
                                                <option value="simhei">黑体</option>
                                                <option value="simsun">宋体</option>
                                                <option value="kaiti">楷体</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>字号</label>
                                            <input type="number" id="secondarySize" value="52" min="12" max="200">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>颜色</label>
                                            <div class="color-input">
                                                <input type="color" id="secondaryColor" value="#1e90ff">
                                                <input type="text" id="secondaryColorText" value="#1E90FF">
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label>Y位置</label>
                                            <input type="number" id="secondaryY" value="200" min="0">
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>X位置</label>
                                            <input type="number" id="secondaryX" value="" placeholder="自动居中">
                                        </div>
                                        <div class="form-group">
                                            <label>对齐</label>
                                            <div class="align-buttons">
                                                <button class="align-btn" data-align="left" data-target="secondary">L</button>
                                                <button class="align-btn active" data-align="center" data-target="secondary">C</button>
                                                <button class="align-btn" data-align="right" data-target="secondary">R</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>样式</label>
                                            <div class="style-buttons">
                                                <button class="style-btn active" data-style="bold" data-target="secondary">B</button>
                                                <button class="style-btn active" data-style="italic" data-target="secondary">I</button>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- 高级特效 -->
                                    <details class="advanced-options">
                                        <summary>高级特效</summary>
                                        <div class="advanced-content">
                                            <div class="effect-group">
                                                <label class="effect-label"><input type="checkbox" id="secondaryStrokeEnabled"><span>描边</span></label>
                                                <div class="effect-options">
                                                    <div class="form-row">
                                                        <div class="form-group"><label>颜色</label><input type="color" id="secondaryStrokeColor" value="#000000"></div>
                                                        <div class="form-group"><label>宽度</label><input type="number" id="secondaryStrokeWidth" value="2" min="1" max="10"></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="effect-group">
                                                <label class="effect-label"><input type="checkbox" id="secondaryShadowEnabled"><span>阴影</span></label>
                                                <div class="effect-options">
                                                    <div class="form-row">
                                                        <div class="form-group"><label>颜色</label><input type="color" id="secondaryShadowColor" value="#333333"></div>
                                                        <div class="form-group"><label>模糊</label><input type="number" id="secondaryShadowBlur" value="2" min="0" max="20"></div>
                                                    </div>
                                                    <div class="form-row">
                                                        <div class="form-group"><label>X偏移</label><input type="number" id="secondaryShadowX" value="3"></div>
                                                        <div class="form-group"><label>Y偏移</label><input type="number" id="secondaryShadowY" value="3"></div>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="effect-group">
                                                <label class="effect-label"><input type="checkbox" id="secondaryBgBlockEnabled"><span>背景色块</span></label>
                                                <div class="effect-options">
                                                    <div class="form-row">
                                                        <div class="form-group"><label>颜色</label><input type="color" id="secondaryBgBlockColor" value="#ffff00"></div>
                                                        <div class="form-group"><label>透明度</label><input type="range" id="secondaryBgBlockOpacity" value="200" min="0" max="255"></div>
